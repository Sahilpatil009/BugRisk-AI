[project]
name = "bugrisk-backend"
version = "0.1.0"
description = "BugRisk AI API and repository analysis worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "cryptography>=43,<46",
  "gitpython>=3.1,<4",
  "pydriller>=2.7,<3",
  "radon>=6,<7",
  "joblib==1.5.3",
  "numpy==2.4.6",
  "scikit-learn==1.9.0",
  "xgboost==3.2.0; platform_system == 'Windows'",
  "xgboost-cpu==3.2.0; platform_system != 'Windows'",
  "shap>=0.46,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1", "mypy>=1.13,<2"]
ml = ["pandas>=2.2,<3", "mlflow>=2.18,<4", "dvc>=3.56,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "supabase*"]
